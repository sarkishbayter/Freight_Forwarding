name: Update exchange rates

on:
  schedule:
    # ECB publishes around 16:00 CET on working days; 17:30 UTC is safely after that.
    - cron: "30 17 * * 1-5"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ECB rates
        run: python3 scripts/update_rates.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/rates.json)" ]; then
            git config user.name "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git add data/rates.json
            git commit -m "Update exchange rates"
            git push
          else
            echo "No changes."
          fi

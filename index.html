            <h1>Freight toolbox</h1>
            <p>Weights, volumes, containers, dates and references for everyday forwarding work.</p>

      <!-- Currency converter (rates come from data/rates.json) -->
      <section id="tool-currency" class="tool" hidden>
        <div id="banner" class="banner" hidden></div>
        <div class="split">
          <form id="converter" class="inputs" autocomplete="off" novalidate>
            <label class="field">
              <span class="cap">Amount</span>
              <input id="amount" class="big-input" type="text" inputmode="decimal" value="1" placeholder="0">
            </label>
            <div class="pair">
              <label class="field">
                <span class="cap">From</span>
                <select id="from"></select>
              </label>
              <button type="button" id="swap" class="swap" aria-label="Swap currencies" title="Swap">&#8644;</button>
              <label class="field">
                <span class="cap">To</span>
                <select id="to"></select>
              </label>
            </div>
          </form>
          <aside class="result" aria-live="polite">
            <div id="result-line" class="result-main">&mdash;</div>
            <div id="rate-line" class="result-sub"></div>
            <p id="source-line" class="meta"></p>
          </aside>
        </div>
      </section>

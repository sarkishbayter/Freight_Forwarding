<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769c9">
  <title>My Calculators</title>
  <meta name="description" content="Personal collection of everyday calculators, starting with a currency converter.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231769c9'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%3D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="brand"><span class="logo" aria-hidden="true">=</span> My Calculators</h1>
      <nav aria-label="Calculators">
        <a href="#currency" class="active">Currency</a>
        <!-- Add new calculators here, e.g. <a href="#loan">Loan</a> -->
      </nav>
    </div>
  </header>

  <div class="wrap intro">
    <h2>Quick conversions</h2>
    <p>Daily reference rates from the European Central Bank.</p>
  </div>

  <main class="wrap">
    <section id="currency" class="card" aria-labelledby="currency-title">
      <h3 id="currency-title">Currency converter</h3>

      <div id="banner" class="banner" hidden></div>

      <form id="converter" autocomplete="off" novalidate>
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" type="text" inputmode="decimal" value="1" placeholder="0">
        </div>

        <div class="pair">
          <div class="field">
            <label for="from">From</label>
            <select id="from"></select>
          </div>

          <button type="button" id="swap" class="swap" aria-label="Swap currencies" title="Swap">⇄</button>

          <div class="field">
            <label for="to">To</label>
            <select id="to"></select>
          </div>
        </div>
      </form>

      <div class="result" aria-live="polite">
        <div id="result-line" class="result-main">—</div>
        <div id="rate-line" class="result-sub"></div>
      </div>

      <p id="source-line" class="meta"></p>
    </section>

    <!-- Next calculators go in more <section class="card"> blocks below -->
  </main>

  <footer class="wrap site-footer">
    <p>Rates are indicative reference rates, not a trading quote.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
